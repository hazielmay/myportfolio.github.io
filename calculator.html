
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | My Portfolio</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>

    <header>
        <a href="index.html#projects" class="back-link">← Back to Projects</a>
    </header>
 
    <main class="calculator-container">
        <div class="calculator">
            <div class="calculator-title">Calculator</div>

            <input type="text" id="display" value="0" readonly>

            <div class="buttons">
                <button>AC</button>
                <button>DEL</button>
                <button>%</button>
                <button>÷</button>

                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>×</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>−</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>+</button>

                <button>0</button>
                <button>.</button>
                <button class="equal">=</button>
            </div>
        </div>
    </main>

    <script src="calc.js"></script>
</body>
</html>
